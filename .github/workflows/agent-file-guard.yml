name: Agent-file guard

# Labels and comments on any PR that modifies the files governing AI-agent
# behavior, so the change is visible before review. CODEOWNERS plus branch
# protection is what actually gates the merge.
#
# `pull_request_target` is required to label PRs from forks, and is safe here
# because the job never checks out or executes PR content — it reads the
# changed-file list through the REST API. It also runs the base branch's copy of
# this file, so a PR cannot disable the guard by editing it.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ARCHITECTURE.md'
      - 'docs/agents/**'
      - '.claude/**'
      - '.github/CODEOWNERS'
      - '.github/zizmor.yml'
      - '.github/workflows/agent-file-guard.yml'

permissions: {}

concurrency:
  group: agent-file-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag:
    name: flag agent-file changes
    runs-on: ubuntu-latest
    permissions:
      issues: write          # create the label
      pull-requests: write   # apply the label, post the comment
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const guardedExact = ['AGENTS.md', 'CLAUDE.md', 'ARCHITECTURE.md', '.github/CODEOWNERS', '.github/zizmor.yml'];
            const guardedPrefixes = ['docs/agents/', '.claude/', '.github/workflows/agent-file-guard.yml'];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const hits = files
              .map((f) => f.filename)
              .filter((name) => guardedExact.includes(name) || guardedPrefixes.some((p) => name.startsWith(p)));
            if (hits.length === 0) {
              core.info('No agent-governance files changed; nothing to flag.');
              return;
            }

            const label = 'agent-config';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: 'b60205',
                  description: 'Modifies files that govern AI-agent behavior; needs maintainer review',
                });
              } else {
                throw e;
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [label] });

            const marker = '<!-- agent-file-guard -->';
            const body = [
              marker,
              '⚠️ **This PR modifies files that govern AI-agent behavior.**',
              '',
              'Changed:',
              ...hits.map((h) => `- \`${h.split(/[`\r\n]/).join('')}\``),
              '',
              'These files are a supply-chain surface (see *Provenance & protection of agent ' +
                'files* in `ARCHITECTURE.md`). A maintainer code owner must review the change ' +
                'and check that it does not weaken review or validation, broaden what an agent ' +
                'may do, or disable this guard.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }
