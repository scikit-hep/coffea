ci:
    autofix_commit_msg: |
        [pre-commit.ci] auto fixes from pre-commit.com hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_branch: ''
    autoupdate_commit_msg: 'ci(pre-commit): pre-commit autoupdate'
    autoupdate_schedule: monthly
    skip: []
    submodules: false

repos:
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
  - id: black

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
    # upstream EDM4hep model files; prek's YAML parser rejects their multiline scalars
    exclude: ^src/coffea/nanoevents/assets/edm4hep_v.*\.yaml$
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: trailing-whitespace

- repo: https://github.com/asottile/pyupgrade
  rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
  hooks:
  - id: pyupgrade
    args: ["--py310-plus"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix, --show-fixes]

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--skip=*.ipynb,*.svg,src/coffea/nanoevents/assets/edm4hep_v*.yaml","-L HEP,hist,Hist,nd,SubJet,subjet,Subjet,PTD,ptd,fPt,fpt,Ser,ser,hda"]

- repo: https://github.com/pre-commit/pygrep-hooks
  rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.10.0
  hooks:
  - id: rst-backticks
  - id: rst-directive-colons
  - id: rst-inline-touching-normal

- repo: https://github.com/abravalheri/validate-pyproject
  rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
  hooks:
  - id: validate-pyproject
    additional_dependencies: ["validate-pyproject-schema-store[all]"]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
  hooks:
  - id: check-dependabot
  - id: check-github-workflows
  - id: check-readthedocs

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
  hooks:
  - id: zizmor
    args: [--persona=pedantic]
