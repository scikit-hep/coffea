# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
  apt_packages:
    - graphviz
  jobs:
    install:
      - echo "setuptools!=78.0.1" >> ruciospark_constraints.txt
      - pip install --upgrade "pip>=25.1"
      - PIP_CONSTRAINT="$(pwd)/ruciospark_constraints.txt" pip install --group docs .
    build:
      html:
        - make -C docs/ html
